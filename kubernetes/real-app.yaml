apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: real-app
  template:
    metadata:
      labels:
        app: real-app
    spec:
      containers:
      - name: real-app-container
        image: nginx:1.25
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: profil-config
        -  secretRef:
            name: profil-secret
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: real-app-service
spec:
  type: LoadBalancer
  selector:
    app: real-app
  ports:
  - port: 9090
    targetPort: 80
